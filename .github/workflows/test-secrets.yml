name: Test GitHub Secrets
on:
  workflow_dispatch:  # 手动触发，方便测试

jobs:
  debug-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Debug TCB_SECRET_ID
        env:
          SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
        run: |
          echo "=== TCB_SECRET_ID 诊断 ==="
          echo "长度: ${#SECRET_ID}"
          if [ -n "$SECRET_ID" ]; then
            echo "状态: ✅ 非空"
            echo "前10个字符: ${SECRET_ID:0:10}..."
          else
            echo "状态: ❌ 为空"
          fi
          echo ""

      - name: Debug TCB_SECRET_KEY
        env:
          SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: |
          echo "=== TCB_SECRET_KEY 诊断 ==="
          echo "长度: ${#SECRET_KEY}"
          if [ -n "$SECRET_KEY" ]; then
            echo "状态: ✅ 非空"
            echo "前10个字符: ${SECRET_KEY:0:10}..."
          else
            echo "状态: ❌ 为空"
          fi
          echo ""

      - name: Debug TCB_ENV_ID
        env:
          ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          echo "=== TCB_ENV_ID 诊断 ==="
          echo "长度: ${#ENV_ID}"
          if [ -n "$ENV_ID" ]; then
            echo "状态: ✅ 非空"
            echo "完整值: $ENV_ID"
          else
            echo "状态: ❌ 为空"
          fi
          echo ""

      - name: 综合诊断报告
        run: |
          echo "📋 综合诊断报告"
          echo "================"
          echo ""
          echo "如果三个Secret长度都>0: ✅ Secrets配置正确"
          echo "如果三个Secret长度都为0: ❌ Secrets未正确传递"
          echo ""
          echo "可能的原因:"
          echo "1. Secret名称不匹配（区分大小写）"
          echo "2. GitHub同步延迟（等待2-5分钟）"
          echo "3. 缓存问题（删除workflow运行记录）"
          echo "4. 仓库权限问题"
          echo ""
          echo "解决方法:"
          echo "1. 确认Secret名称完全一致:"
          echo "   - TCB_SECRET_ID (必须完全匹配)"
          echo "   - TCB_SECRET_KEY (必须完全匹配)"
          echo "   - TCB_ENV_ID (必须完全匹配)"
          echo "2. 删除并重新添加Secrets"
          echo "3. 等待5分钟后重试"
          echo "4. 或改用Webify一键部署（推荐）"