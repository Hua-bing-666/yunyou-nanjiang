name: Verify travel guide
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: my-travel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: my-travel/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-acceptance
          path: |
            my-travel/playwright-report
            my-travel/test-results
          retention-days: 14
