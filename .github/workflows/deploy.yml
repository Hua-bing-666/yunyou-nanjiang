name: Deploy Frontend to Tencent Cloud CloudBase

on:
  push:
    branches:
      - main  # 主分支推送时触发自动部署
  pull_request:
    branches:
      - main  # PR时运行测试，不部署

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install frontend dependencies
      run: cd my-travel && npm ci

    - name: Build frontend
      run: cd my-travel && npm run build

    - name: Install CloudBase CLI
      run: npm install -g @cloudbase/cli

    - name: Deploy to CloudBase Hosting (Main Branch)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
        TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
      run: |
        echo "🚀 开始部署前端到CloudBase静态托管..."
        echo "📋 部署信息："
        echo "   仓库: ${{ github.repository }}"
        echo "   分支: ${{ github.ref }}"
        echo "   提交: ${{ github.sha }}"
        
        if [ -z "$TCB_SECRET_ID" ] || [ -z "$TCB_SECRET_KEY" ] || [ -z "$TCB_ENV_ID" ]; then
          echo "❌ 缺少CloudBase配置，请在GitHub Secrets中设置："
          echo "   TCB_SECRET_ID, TCB_SECRET_KEY, TCB_ENV_ID"
          echo "📖 请参考部署指南完成配置"
          exit 1
        fi
        
        echo "✅ CloudBase配置检测通过"
        echo "🔐 登录CloudBase..."
        tcb login --apiKeyId $TCB_SECRET_ID --apiKey $TCB_SECRET_KEY
        
        echo "📤 部署前端到CloudBase静态托管..."
        cd my-travel
        tcb hosting deploy ./dist -e $TCB_ENV_ID
        
        echo "🎉 前端部署成功！"
        echo "🌐 请稍后在CloudBase控制台查看访问地址"
        
    - name: PR validation only
      if: github.event_name == 'pull_request'
      run: |
        echo "🔍 PR验证通过，可以合并到main分支"
        echo "📊 验证结果："
        echo "   ✅ 前端依赖安装成功"
        echo "   ✅ 前端构建成功"
        echo "📌 合并后将自动部署到CloudBase"

  # 部署状态提醒
  deployment-status:
    needs: test-and-deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Wait for deployment propagation
      run: |
        echo "⏳ 等待CloudBase部署完成..."
        echo "ℹ️  CloudBase部署通常需要1-3分钟完成CDN分发"
        echo "🔄 请在3分钟后访问网站进行验证"
        
    - name: Deployment completion reminder
      run: |
        echo "📋 部署完成后续步骤："
        echo "1. 登录腾讯云控制台：https://console.cloud.tencent.com/tcb"
        echo "2. 进入您的环境，查看'静态网站托管'"
        echo "3. 获取访问地址并测试功能"
        echo "4. 如有问题，查看部署日志"
        echo ""
        echo "⚠️ 注意：后端需要单独运行"
        echo "   比赛演示时请同时启动后端服务器："
        echo "   cd backend && npm start"
