<!DOCTYPE html>
<html lang="zh-CN">
  <head>

    <meta charset="UTF-8">
    <title>云游南疆 · 南疆文化导览</title>
    <meta name="description" content="探索南疆文化资料与主题路线，收藏景点，保存和分享旅行计划。">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    background-color: #f8f5f0;
    overflow-x: hidden;
  }
  /* 主容器：默认全宽，但在大屏幕上限制最大宽度并居中 */
  #app {
    width: 100%;
    max-width: 1200px;    /* 电脑上内容最大宽度1200px，更舒展 */
    margin: 0 auto;        /* 水平居中 */
    background-color: #f8f5f0;
    min-height: 100vh;
    box-shadow: 0 0 20px rgba(0,0,0,0.05);
  }
  /* 手机端：去掉最大宽度限制，全屏显示，无阴影 */
  @media (max-width: 768px) {
    #app {
      max-width: 100%;
      box-shadow: none;
      margin: 0;
    }
  }
</style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
